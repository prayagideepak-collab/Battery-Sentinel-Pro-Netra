name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debug-build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.3.1
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Verify offline-only guardian manifest and dependencies
        run: |
          if grep -R 'android.permission.INTERNET' battery-guardian/src/main/AndroidManifest.xml; then
            echo "Guardian must not declare INTERNET permission"; exit 1
          fi
          if grep -Ei 'firebase|retrofit|okhttp|analytics|play-services' battery-guardian/build.gradle.kts; then
            echo "Guardian must not add network, cloud, analytics or tracking dependencies"; exit 1
          fi
      - name: Build existing app and standalone offline guardian
        run: gradle --no-daemon :app:assembleDebug :battery-guardian:assembleDebug :battery-guardian:testDebugUnitTest
      - name: Upload Battery Sentinel APK
        uses: actions/upload-artifact@v4
        with:
          name: battery-sentinel-pro-netra-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
      - name: Upload Netra Battery Guardian APK
        uses: actions/upload-artifact@v4
        with:
          name: netra-battery-guardian-offline-debug-apk
          path: battery-guardian/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
