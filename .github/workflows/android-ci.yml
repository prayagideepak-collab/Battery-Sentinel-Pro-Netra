name: Android CI

on:
  push:
    branches: [main, "audit/**", "fix/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  debug-build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew
      - name: Build debug APK and run unit tests
        run: ./gradlew --no-daemon :app:assembleDebug :app:testDebugUnitTest --stacktrace
      - name: Run Android lint
        run: ./gradlew --no-daemon :app:lintDebug --stacktrace
      - name: Upload debug APK and test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: battery-sentinel-pro-netra-debug-and-test-reports
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/reports/lint-results-debug.html
            app/build/test-results/testDebugUnitTest/*.xml
          if-no-files-found: warn
          retention-days: 14
